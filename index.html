<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slicer</title>
<meta name="description" content="画像を縦に分割してXに投稿。画像は端末内で処理され、送信されません。">
<meta property="og:title" content="Slicer">
<meta property="og:description" content="画像を縦に分割してXに投稿。画像は端末内で処理され、送信されません。">
<meta property="og:url" content="https://llepsism-del.github.io/slicer/">
<meta name="twitter:card" content="summary">
<style>
:root{--b:#1d6bff;--g:#e6e9ef;--t:#1a1a1a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--t);background:#fff}
main{max-width:720px;margin:auto;padding:16px}
h1{font-size:18px;margin:0 0 12px}h1 b{color:var(--b)}
#drop{display:block;border:2px dashed var(--g);border-radius:12px;padding:28px;text-align:center;color:#888;cursor:pointer}
#drop.on{border-color:var(--b);color:var(--b)}
input[type=file]{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;align-items:center}
button{font:inherit;border:1px solid var(--g);background:#fff;color:var(--t);border-radius:8px;padding:8px 12px;cursor:pointer}
button:active{background:#f3f6ff}
button.p{background:var(--b);border-color:var(--b);color:#fff}
button:disabled{opacity:.4}
button.ic{display:inline-flex;padding:10px 16px}
input[type=range]{flex:1;accent-color:var(--b)}#nv{min-width:2em;color:var(--b)}
dialog{border:0;border-radius:12px;padding:20px;max-width:320px;box-shadow:0 8px 32px #0003}dialog::backdrop{background:#0004}dialog p{margin:0 0 16px}dialog form{text-align:right}
#pv{display:flex;gap:3px;width:100%}
#pv canvas{flex:1;min-width:0;height:auto;border-radius:3px;background:#f4f4f4}
#msg{font-size:13px;color:#888;min-height:1.5em}
#app{display:none}
footer{font-size:12px;color:#aaa;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>Slicer<b>.</b></h1>
<label id="drop">画像を選択 / ドロップ<input type="file" id="f" accept="image/*"></label>
<div id="app">
  <div class="row">
    <button class="ic" data-op="l" title="左に90°回転" aria-label="左に90°回転"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v5h5"/><path d="M3.5 9A8.5 8.5 0 1 1 5 17"/></svg></button>
    <button class="ic" data-op="r" title="右に90°回転" aria-label="右に90°回転"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4v5h-5"/><path d="M20.5 9A8.5 8.5 0 1 0 19 17"/></svg></button>
    <button class="ic" data-op="h" title="左右反転" aria-label="左右反転"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2 2.5"/><path d="M9 6L3 18h6z"/><path d="M15 6l6 12h-6z"/></svg></button>
    <button class="ic" data-op="v" title="上下反転" aria-label="上下反転"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18" stroke-dasharray="2 2.5"/><path d="M6 9L18 3v6z"/><path d="M6 15l12 6v-6z"/></svg></button>
    <button class="ic" data-op="x" title="元に戻す" aria-label="元に戻す"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  </div>
  <div class="row">分割数 <input type="range" id="n" value="10" min="2" max="20"> <b id="nv">10</b></div>
  <div id="pv"></div>
  <div class="row">
    <button class="p ic" id="share" title="共有" aria-label="共有"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    <button class="ic" id="save" title="保存" aria-label="保存"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg></button>
  </div>
  <div id="msg"></div>
</div>
<footer>画像は端末内で処理され、どこにも送信されません。</footer>
</main>
<dialog id="dlg"><p id="dm"></p><form method="dialog"><button class="p">OK</button></form></dialog>
<script>
const $=s=>document.querySelector(s);
let orig=null,cur=null,blobs=[],busy=null,name='img';

function load(file){
  if(!file||!file.type.startsWith('image/'))return;
  name=file.name.replace(/\.[^.]+$/,'')||'img';
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
    const c=document.createElement('canvas');
    c.width=img.naturalWidth;c.height=img.naturalHeight;
    c.getContext('2d').drawImage(img,0,0);
    URL.revokeObjectURL(url);
    orig=c;cur=c;$('#app').style.display='block';update();
  };
  img.src=url;
}

function transform(op){
  if(op==='x'){cur=orig;return update();}
  const rot=op==='l'||op==='r',c=document.createElement('canvas');
  c.width=rot?cur.height:cur.width;c.height=rot?cur.width:cur.height;
  const x=c.getContext('2d');
  if(op==='r'){x.translate(c.width,0);x.rotate(Math.PI/2);}
  if(op==='l'){x.translate(0,c.height);x.rotate(-Math.PI/2);}
  if(op==='h'){x.translate(c.width,0);x.scale(-1,1);}
  if(op==='v'){x.translate(0,c.height);x.scale(1,-1);}
  x.drawImage(cur,0,0);cur=c;update();
}

function cuts(){
  const n=Math.max(2,Math.min(20,+$('#n').value||10)),W=cur.width,a=[];
  for(let i=0;i<n;i++){const x0=Math.round(i*W/n),x1=Math.round((i+1)*W/n);a.push([x0,x1-x0]);}
  return a;
}

function update(){
  const pv=$('#pv');pv.innerHTML='';
  const parts=cuts(),H=cur.height,s=Math.min(1,400/H);
  for(const [x,w] of parts){
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*s));c.height=Math.round(H*s);
    c.getContext('2d').drawImage(cur,x,0,w,H,0,0,c.width,c.height);
    pv.appendChild(c);
  }
  // 共有時に間に合うよう、先に書き出しておく
  blobs=[];$('#share').disabled=$('#save').disabled=true;msg('書き出し中…');
  const job=busy=Promise.all(parts.map(([x,w],i)=>new Promise(res=>{
    const c=document.createElement('canvas');c.width=w;c.height=H;
    c.getContext('2d').drawImage(cur,x,0,w,H,0,0,w,H);
    c.toBlob(b=>res(new File([b],`${name}_${String(i+1).padStart(2,'0')}.jpg`,{type:'image/jpeg'})),'image/jpeg',.92);
  }))).then(f=>{if(job!==busy)return;blobs=f;$('#share').disabled=$('#save').disabled=false;msg(`${f.length}枚 / ${(f.reduce((s,b)=>s+b.size,0)/1048576).toFixed(1)}MB`);});
}

function msg(t){$('#msg').textContent=t;}
function pop(t){$('#dm').textContent=t;$('#dlg').showModal();}

$('#f').onchange=e=>load(e.target.files[0]);
const d=$('#drop');
d.ondragover=e=>{e.preventDefault();d.classList.add('on');};
d.ondragleave=()=>d.classList.remove('on');
d.ondrop=e=>{e.preventDefault();d.classList.remove('on');load(e.dataTransfer.files[0]);};
document.onpaste=e=>{const it=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));if(it)load(it.getAsFile());};
document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>cur&&transform(b.dataset.op));
$('#n').oninput=()=>$('#nv').textContent=$('#n').value;
$('#n').onchange=()=>cur&&update();

$('#share').onclick=async()=>{
  if(blobs.length>10)return pop('ブラウザからの共有は10枚までです。11枚以上は保存ボタンで保存してからXで選んでください。');
  if(!navigator.canShare||!navigator.canShare({files:blobs})){msg('このブラウザは共有に非対応です。保存ボタンを使ってください');return;}
  try{await navigator.share({files:blobs});}catch(e){if(e.name!=='AbortError')msg('共有に失敗しました: '+e.message);}
};

async function saveAll(){
  msg('保存中…（複数ダウンロードの確認が出たら許可）');
  for(const f of blobs){
    const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    await new Promise(r=>setTimeout(r,250));
  }
  msg(`${blobs.length}枚保存しました。Xアプリで順に選択してください`);
}
$('#save').onclick=saveAll;
</script>
</body>
</html>
